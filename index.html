<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💥ماتشتريش- ستور شوزات 💥</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap');
body { 
    font-family: 'Cairo', sans-serif; 
    margin:0; padding:0; overflow-x:hidden;
    background: linear-gradient(45deg, #b8860b, #8b7500, #a67c00, #cdaa7d); 
    background-size: 400% 400%; 
    animation: goldBG 20s ease infinite; 
}
@keyframes goldBG { 
    0%{background-position:0% 50%;} 
    50%{background-position:100% 50%;} 
    100%{background-position:0% 50%;} 
}
#collection-popup { pointer-events:auto; z-index:9999; } 
#collection-popup button { cursor:pointer; }
#collection-popup h1 { 
    font-size: 1.5rem; 
    background: linear-gradient(to right, #000000, #FFD700); 
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent; 
}
#toast { 
    pointer-events:none; 
    position:fixed; 
    top:50%; 
    left:50%; 
    transform: translate(-50%, -50%);
    background: linear-gradient(90deg, #FFD700, #FFA500, #FFFACD, #FFD700); 
    color:black; 
    padding:15px 25px; 
    border-radius:20px; 
    font-weight:bold; 
    font-size:1.2rem;
    box-shadow:0 0 30px #FFD700,0 0 60px #FFA500,0 0 90px #FFFACD; 
    opacity:0; 
    transition: all 0.5s ease; 
    z-index:9999; 
    text-align:center; 
}
.animate-pop { animation: pop 0.6s ease forwards; } 
@keyframes pop { 0% {transform:scale(0); opacity:0;} 100% {transform:scale(1); opacity:1;} }
.pulse { animation: pulseGlow 1.5s infinite; } 
@keyframes pulseGlow { 0% {box-shadow:0 0 15px #ff0;} 50% {box-shadow:0 0 45px #ff0;} 100% {box-shadow:0 0 15px #ff0;} }
.product-fly { animation: flyIn 1s ease forwards; } 
@keyframes flyIn { 0% {opacity:0; transform: translateY(-500px) rotate(-10deg) scale(0.3);} 50%{ transform: translateY(-50px) rotate(5deg) scale(1.05);} 100% {opacity:1; transform: translateY(0) rotate(0) scale(1);} }
img, button { transition: all 0.3s ease; } 
button:hover { transform: scale(1.1); box-shadow:0 0 25px #ff0,0 0 50px #f0f,0 0 75px #0ff; }
.switch-btn { background:#FFD700; color:#000; font-weight:bold; border-radius:12px; padding:8px 12px; margin:10px auto; cursor:pointer; display:block; text-align:center; box-shadow:0 0 10px #FFD700,0 0 20px #FFA500; }
.switch-btn:hover { transform:scale(1.1); }
#invoice { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); background: white; padding: 20px; border-radius: 20px; box-shadow: 0 0 20px #00000080; width: 90%; max-width: 500px; z-index: 99999; display: none; }
#invoice h2 { text-align: center; font-weight: 900; color: #FFD700; margin-bottom: 15px; }
#invoice table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
#invoice table, #invoice th, #invoice td { border: 1px solid #ddd; }
#invoice th, #invoice td { padding: 8px; text-align: center; }
#invoice .close-invoice { display:block; margin: 0 auto; padding: 8px 20px; background: #FFD700; color: black; font-weight: bold; border-radius: 12px; cursor: pointer; }
#loader { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index: 999999; display: none; }
#loader div { border: 6px solid #f3f3f3; border-top: 6px solid #FFD700; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loader"><div></div></div>

<!-- نافذة الترحيب -->
<div id="collection-popup" class="fixed inset-0 flex items-center justify-center z-50 backdrop-blur-sm bg-gold/70">
  <div class="bg-white/90 p-8 rounded-3xl shadow-2xl w-96 text-center animate-pop ring-8 ring-yellow-400 pulse">
    <h1 class="mb-4 animate-pop">💥أهلا بيك في ستور💥   [ماتشتريش]</h1>
    <p class="text-gray-700 mb-6 text-lg font-semibold">عايز تشوف منتجاتنا الحريمي ولا الرجالي؟</p>
    <button id="male-collection" class="w-full bg-yellow-500 text-white py-3 rounded-xl mb-3 font-black text-xl shadow-lg pulse">👞 رجالي</button>
    <button id="female-collection" class="w-full bg-pink-500 text-white py-3 rounded-xl font-black text-xl shadow-lg pulse">👠 حريمي</button>
  </div>
</div>

<div id="toast"></div>

<header class="max-w-6xl mx-auto flex items-center justify-between p-6 border-b border-yellow-200 relative">
  <div class="flex items-center gap-3">
    <img src="https://i.postimg.cc/TwvxgRrN/550816979-844120788145479-6887980593067427015-n.jpg" alt="شعار" class="w-12 h-12 rounded-full ring-4 ring-yellow-400 shadow-md hover:scale-150 transition-all">
    <div class="flex flex-col">
      <h1 class="text-1xl font-black text-gray-800 leading-tight animate-pop">ماتشتريش</h1>
      <p class="text-sm text-black-500 -mt-1 tracking-wide animate-pop">غير اللي يليق بيك ✨</p>
    </div>
  </div>
  <div class="flex items-center gap-3">
    <button id="switch-collection" class="bg-yellow-500 text-white px-0.0.9 py-1 text-sm rounded-lg font-bold mt-20 hover:scale-110 transition-all">تبديل القسم</button>
    <button id="cart-btn" class="px-5 py-2 bg-yellow-500 text-white rounded-xl flex items-center gap-2 font-black hover:scale-125 transition-all shadow-lg pulse">
      🛒 <span>السلة (0)</span>
    </button>
  </div>
</header>

<main id="products" class="max-w-6xl mx-auto grid sm:grid-cols-2 lg:grid-cols-3 gap-8 p-6"></main>

<div id="cart" class="fixed inset-0 bg-black/40 hidden justify-end z-50">
  <div class="bg-white w-[370px] sm:w-96 h-full p-6 flex flex-col rounded-l-3xl shadow-2xl border-l-4 border-yellow-500 overflow-y-auto animate-pop">
    <div class="flex justify-between items-center mb-4 border-b pb-2">
      <h2 class="text-lg font-black text-yellow-600">🛒 السلة</h2>
      <button id="close-cart" class="text-gray-500 hover:text-red-500 text-xl">✕</button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto space-y-3"></div>
    <div class="mt-4 font-black text-lg text-right text-gray-800" id="total">الإجمالي: <span class='text-yellow-600 font-black'>0 جنيه</span></div>
    <p class="text-center mt-3 text-green-600 font-bold text-lg">الدفع عند الاستلام ✅</p>
    <div class="mt-6 border-t pt-4">
      <h3 class="font-black mb-2 text-center text-gray-700">📦 بيانات الطلب</h3>
      <form id="order-form" class="space-y-2">
        <input name="name" placeholder="الاسم" required class="border p-2 rounded w-full" />
        <input name="phone" placeholder="رقم موبايلك" required class="border p-2 rounded w-full" />
        <input name="altPhone" placeholder="رقم موبايل احتياطي" class="border p-2 rounded w-full" />
        <input name="address" placeholder="العنوان" required class="border p-2 rounded w-full" />
        <label class="block text-gray-700 font-black mt-2">اختار مقاسك</label>
        <select name="size" id="size-select" class="border p-2 rounded w-full">
          <option value="">-- اختار المقاس --</option>
        </select>
        <button type="submit" class="w-full bg-yellow-500 text-white py-2 rounded-lg font-black mt-4 hover:scale-125 transition-all pulse">إرسال الطلب</button>
      </form>
    </div>
  </div>
</div>

<div id="invoice">
  <h2>دي فاتورتك خدها سكرين وخليها معاك🥰</h2>
  <table id="invoice-table">
    <thead>
      <tr>
        <th>اسم المنتج</th>
        <th>الكمية</th>
        <th>السعر</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p id="invoice-total" class="font-bold text-right"> الإجمالي بدون الشحن: 0 جنيه</p>
  <p id="invoice-customer" class="mt-2"></p>
  <p id="invoice-date" class="mt-2"></p>
  <span class="close-invoice" onclick="document.getElementById('invoice').style.display='none'">أغلق الفاتورة</span>
</div>

<script>
// Loader
const loader = document.getElementById('loader');
function showLoader(){ loader.style.display='flex'; }
function hideLoader(){ loader.style.display='none'; }

// المنتجات
const allProducts = [
  { id:1, name:"الديك الفرنسي ابيض ف احمر", price:280, image:"https://i.postimg.cc/MKX7qKRy/570893393-871336388757252-74939307031368722-n.jpg", type:"male" },
  { id:2, name:"الديك الفرنسي ابيض ف اسود", price:280, image:"https://i.postimg.cc/wjwYJ2MQ/568744248-871336448757246-5143257899591873607-n.jpg", type:"male" },
  { id:3, name:"نيو بلانس ابيض ف اسود", price:280, image:"https://i.postimg.cc/q7gcMJW6/569032872-871336988757192-1100054162643539695-n.jpg", type:"male" },
  { id:4, name:"نيو بلانس اسود ف ابيض", price:280, image:"https://i.postimg.cc/CxrDtydN/569293050-871336785423879-1324089676429450702-n.jpg", type:"male" },
  { id:5, name:"نيو بلانس اسود ف بيچ", price:280, image:"https://i.postimg.cc/QC08Y3SW/571350934-871336632090561-6089648114365501598-n.jpg", type:"male" },
  { id:6, name:"بولو اسود ف رصاصي", price:280, image:"https://i.postimg.cc/B6kqFghN/569057434-871336695423888-9120106915970436646-n.jpg", type:"male" },
  { id:7, name:"بولو ابيض ف اسود", price:280, image:"https://i.postimg.cc/ZYwQwn49/571146280-871336928757198-8793438079405721773-n.jpg", type:"male" },
  { id:8, name:"بولو اسود ف ابيض", price:280, image:"https://i.postimg.cc/YCTKb9Nv/571354815-871336845423873-6702696002398135669-n.jpg", type:"male" },
  { id:9, name:"اير ماكس ابيض", price:300, image:"https://i.postimg.cc/XqzMy7QB/574424610-876301951594029-1038148045299282375-n.jpg", type:"male" },
  { id:10, name:"فاشون شتوي رصاصي", price:350, image:"https://i.postimg.cc/pdYgJBsH/577158719-880485034509054-2260797099197674745-n.jpg", type:"male" },
  { id:11, name:"فاشون شتوي اسود", price:350, image:"https://i.postimg.cc/tTq8SVc5/577126114-880484954509062-1861825450046656111-n.jpg", type:"male" },
  { id:12, name:"فاشون شتوي بيچ", price:350, image:"https://i.postimg.cc/V6Kp3kQd/575166211-880484801175744-5927234518724415400-n.jpg", type:"male" },
  { id:13, name:"هاف بوط شتوي بيچ", price:350, image:"https://i.postimg.cc/SR55x1xd/577229294-880551887835702-2466422141298345740-n.jpg", type:"male" },
  { id:14, name:"نايك توينز ابيض ف رصاصي", price:300, image:"https://i.postimg.cc/1zvbdrqn/576843905-883947857496105-6790202241856284727-n.jpg", type:"female" },
  { id:15, name:"نايك توينز ابيض ف نبيتي", price:300, image:"https://i.postimg.cc/Pfg90xP4/576914567-883947607496130-1454587221797658254-n.jpg", type:"female" },
  { id:16, name:"نايك توينز ابيض ف اسود", price:300, image:"https://i.postimg.cc/W3QYRWpC/579484530-883947780829446-2943000794086995307-n.jpg", type:"female" },
  { id:17, name:"المستورد اسود ف ابيض", price:300, image:"https://i.postimg.cc/66v1VXYp/578611395-883947950829429-6215013070031930120-n.jpg", type:"female" },
  { id:18, name:"المستورد ابيض ف اسود", price:300, image:"https://i.postimg.cc/SxyTpzq2/577446192-883948177496073-5727602666866394815-n.jpg", type:"female" },
  { id:19, name:"المستورد ابيض ف بيچ", price:300, image:"https://i.postimg.cc/d035hPhk/577427138-883948047496086-4254395622299081664-n.jpg", type:"female" },
];

const productSizes = {
  1: { 41: "on", 42: "on", 43: "off", 44: "on", 45: "on" },
  2: { 41: "off", 42: "on", 43: "on", 44: "on", 45: "off" },
  3: { 41: "on", 42: "off", 43: "on", 44: "on", 45: "on" },
  4: { 41: "on", 42: "on", 43: "on", 44: "off", 45: "on" },
  5: { 41: "on", 42: "on", 43: "off", 44: "on", 45: "off" },
  6: { 41: "on", 42: "on", 43: "on", 44: "on", 45: "on" },
  7: { 41: "off", 42: "on", 43: "on", 44: "on", 45: "on" },
8: { 41: "on", 42: "off", 43: "on", 44: "on", 45: "on" },
9: { 41: "on", 42: "on", 43: "on", 44: "off", 45: "on" },
10: { 41: "on", 42: "on", 43: "off", 44: "on", 45: "on" },
11: { 41: "off", 42: "on", 43: "on", 44: "on", 45: "off" },
12: { 41: "on", 42: "on", 43: "off", 44: "on", 45: "on" },
13: { 41: "on", 42: "on", 43: "on", 44: "on", 45: "off" },
14: { 37: "on", 38: "on", 39: "off", 40: "on", 41: "on" },
15: { 37: "off", 38: "on", 39: "on", 40: "on", 41: "off" },
16: { 37: "on", 38: "on", 39: "off", 40: "on", 41: "on" },
17: { 37: "on", 38: "off", 39: "on", 40: "on", 41: "on" },
18: { 37: "on", 38: "on", 39: "on", 40: "off", 41: "on" },
19: { 37: "on", 38: "on", 39: "off", 40: "on", 41: "on" }
};

let selectedType = null;
const cart = [];
const productContainer = document.getElementById("products");
const cartBtn = document.getElementById("cart-btn");
const cartWindow = document.getElementById("cart");
const closeCart = document.getElementById("close-cart");
const cartItems = document.getElementById("cart-items");
const total = document.getElementById("total");
const form = document.getElementById("order-form");
const sizeSelect = document.getElementById("size-select");
const collectionPopup = document.getElementById("collection-popup");
const toast = document.getElementById("toast");

const invoice = document.getElementById('invoice');
const invoiceTable = document.querySelector('#invoice-table tbody');
const invoiceTotal = document.getElementById('invoice-total');
const invoiceCustomer = document.getElementById('invoice-customer');
const invoiceDate = document.getElementById('invoice-date');

// اختيار القسم
document.getElementById("male-collection").onclick = () => selectCollection("male");
document.getElementById("female-collection").onclick = () => selectCollection("female");
document.getElementById("switch-collection").onclick = () => switchCollection();

function selectCollection(type) {
    selectedType = type;
    collectionPopup.classList.add("hidden");
    renderProducts();
}

function switchCollection() {
    selectedType = selectedType === "male" ? "female" : "male";
    renderProducts();
}

// عرض المنتجات مع المقاسات
function renderProducts() {
    productContainer.innerHTML = '';
    const filtered = allProducts.filter(p => p.type === selectedType);
    filtered.forEach((p, i) => {
        const div = document.createElement("div");
        div.className = "bg-white rounded-2xl shadow-lg p-4 hover:shadow-2xl transition-all hover:scale-[1.05] cursor-pointer product-fly";
        div.style.animationDelay = `${i * 0.1}s`;

        // عرض المقاسات المتاحة فقط
        const sizes = productSizes[p.id];
        const availableSizes = Object.entries(sizes)
            .filter(([size, status]) => status === "on")
            .map(([size]) => size)
            .join(', ');

        let sizesHTML = '';
        if (availableSizes) {
            sizesHTML = `<p class="mt-2 text-sm text-gray-600 font-semibold">المقاسات المتاحة: ${availableSizes}</p>`;
        }

        div.innerHTML = `
            <img src="${p.image}" alt="${p.name}" class="w-full h-[300px] object-contain rounded-xl shadow-sm mb-3" />
            <div class="text-center">
                <h3 class="font-semibold text-lg text-gray-800">${p.name}</h3>
                <p class="text-yellow-600 font-bold mt-1">${p.price} جنيه</p>
                ${sizesHTML}
                <button class="mt-3 px-5 py-2 bg-yellow-500 text-white rounded-lg font-semibold hover:scale-110 transition-all shadow-md">أضف لسلة المشتريات🛒</button>
            </div>
        `;
        div.querySelector("button").onclick = () => { addToCart(p); };
        productContainer.appendChild(div);
    });
}

// إضافة للسلة
function addToCart(product) {
    const found = cart.find(p => p.id === product.id);
    if (found) found.qty++;
    else cart.push({ ...product, qty: 1 });
    updateCart();
    renderSizesForCart(cart[cart.length - 1].id); // تحديث المقاسات
    toast.textContent = `تمت إضافة المنتج للسلة✅ اذهب للسلة لاختيار مقاسك👟`;
    toast.style.opacity = "1";
    setTimeout(() => { toast.style.opacity = "0"; }, 3000);
}

// تحديث السلة
function updateCart() {
    cartItems.innerHTML = ''; let sum = 0;
    cart.forEach(item => {
        sum += item.price * item.qty;
        const div = document.createElement("div");
        div.className = "flex items-center justify-between py-3 border-b";
        div.innerHTML = `<div><p class="font-medium text-gray-800">${item.name}</p><p class="text-sm text-gray-600">${item.qty} × ${item.price} جنيه</p></div>
        <button class="text-red-500">🗑️</button>`;
        div.querySelector("button").onclick = () => removeFromCart(item.id);
        cartItems.appendChild(div);
    });
    total.innerHTML = `الاجمالي بدون الشحن: <span class='text-yellow-600'>${sum} جنيه</span>`;
    cartBtn.innerHTML = `🛒 <span>السلة (${cart.reduce((s, i) => s + i.qty, 0)})</span>`;
}

// إزالة من السلة
function removeFromCart(id) { const index = cart.findIndex(p => p.id === id); if (index !== -1) cart.splice(index, 1); updateCart(); }

// عرض/إخفاء السلة
cartBtn.onclick = () => cartWindow.classList.remove("hidden");
closeCart.onclick = () => cartWindow.classList.add("hidden");

// عرض المقاسات حسب المنتج في السلة
function renderSizesForCart(productId) {
    sizeSelect.innerHTML = '<option value="">-- اختار المقاس --</option>';
    const sizes = productSizes[productId];
    for (const size in sizes) {
        const status = sizes[size];
        const opt = document.createElement('option');
        opt.value = size;
        opt.textContent = status === "on" ? size : `${size} - غير متوفر`;
        if (status === "off") opt.disabled = true;
        sizeSelect.appendChild(opt);
    }
}

// إرسال الطلب
form.onsubmit = async e => {
    e.preventDefault();
    if (cart.length === 0) { alert("السلة فارغة"); return; }
    showLoader();
    const data = Object.fromEntries(new FormData(form));
    data.items = cart.map(i => `${i.name} × ${i.qty}`).join(", ");
    try {
        await fetch("https://formbold.com/s/oylkY", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
        alert("تم ارسال الطلب بنجاح✅ والاوردر هيوصلك في اسرع وقت باذن الله 🥰 دوس تم لاستلام الفاتورة");

        // إنشاء الفاتورة
        invoiceTable.innerHTML = '';
        cart.forEach(i => {
            invoiceTable.innerHTML += `<tr><td>${i.name}</td><td>${i.qty}</td><td>${i.price * i.qty} جنيه</td></tr>`;
        });
        const sum = cart.reduce((s, i) => s + i.price * i.qty, 0);
        invoiceTotal.textContent = `الاجمالي بدون الشحن: ${sum} جنيه`;
        invoiceCustomer.textContent = `الاسم: ${data.name}, الهاتف: ${data.phone}, بديل: ${data.altPhone || '-'} , العنوان: ${data.address}, المقاس: ${data.size || '-'}`;
        const now = new Date();
        invoiceDate.textContent = `التاريخ والوقت: ${now.toLocaleString()}`;
        invoice.style.display = 'block';

        // إعادة ضبط السلة
        cart.length = 0;
        updateCart();
        form.reset();
        cartWindow.classList.add("hidden");
        hideLoader();

    } catch (err) {
        hideLoader();
        alert("❌ حدث خطأ أثناء الإرسال، حاول مرة أخرى");
        console.error(err);
    }
};
</script>
</body>
</html>
