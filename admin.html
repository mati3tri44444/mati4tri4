<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة المنتجات - ماتشتريش</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #fef9c3; }
  .hidden { display: none; }
</style>
</head>
<body class="font-sans">

<!-- شاشة تسجيل الدخول -->
<div id="login-screen" class="fixed inset-0 flex items-center justify-center bg-yellow-100">
  <div class="bg-white p-8 rounded-3xl shadow-xl w-80 text-center">
    <h2 class="text-2xl font-bold text-yellow-600 mb-4">🔒 تسجيل دخول الإدارة</h2>
    <input id="password" type="password" placeholder="كلمة المرور" class="border p-2 rounded w-full mb-4 text-center">
    <button id="login-btn" class="bg-yellow-500 text-white px-4 py-2 rounded w-full hover:bg-yellow-600">دخول</button>
    <p id="error" class="text-red-500 mt-3 hidden">كلمة المرور غير صحيحة ❌</p>
  </div>
</div>

<!-- لوحة الإدارة -->
<div id="admin-panel" class="hidden p-6 max-w-4xl mx-auto">
  <h1 class="text-3xl font-bold text-yellow-600 mb-6 text-center">🧺 لوحة إدارة المنتجات</h1>

  <!-- إضافة منتج -->
  <form id="add-product-form" class="bg-white p-6 rounded-2xl shadow-md mb-8 grid md:grid-cols-2 gap-4">
    <input name="name" placeholder="اسم المنتج" required class="border p-2 rounded">
    <input name="price" type="number" placeholder="السعر بالجنيه" required class="border p-2 rounded">
    <input name="image" placeholder="رابط الصورة" required class="border p-2 rounded col-span-full">
    <select name="type" required class="border p-2 rounded">
      <option value="">نوع المنتج</option>
      <option value="male">رجالي</option>
      <option value="female">حريمي</option>
    </select>
    <button class="bg-yellow-500 hover:bg-yellow-600 text-white py-2 rounded font-semibold col-span-full">➕ إضافة المنتج</button>
  </form>

  <!-- عرض المنتجات -->
  <div id="product-list" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</div>

<script>
const PASSWORD = "admin123"; // 🔑 غيرها لو حبيت
const loginScreen = document.getElementById("login-screen");
const adminPanel = document.getElementById("admin-panel");
const loginBtn = document.getElementById("login-btn");
const passwordInput = document.getElementById("password");
const errorMsg = document.getElementById("error");
const productList = document.getElementById("product-list");
const form = document.getElementById("add-product-form");

let products = JSON.parse(localStorage.getItem("products")) || [];

loginBtn.onclick = () => {
  if (passwordInput.value === PASSWORD) {
    loginScreen.classList.add("hidden");
    adminPanel.classList.remove("hidden");
    renderProducts();
  } else {
    errorMsg.classList.remove("hidden");
  }
};

// حفظ المنتجات في التخزين المحلي
function saveProducts() {
  localStorage.setItem("products", JSON.stringify(products));
}

// عرض المنتجات
function renderProducts() {
  productList.innerHTML = "";
  if (products.length === 0) {
    productList.innerHTML = `<p class="text-center col-span-full text-gray-500">لا توجد منتجات بعد 😅</p>`;
    return;
  }

  products.forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "bg-white rounded-xl shadow-md p-4";
    div.innerHTML = `
      <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover rounded-lg mb-3" />
      <h3 class="font-semibold text-lg">${p.name}</h3>
      <p class="text-yellow-600 font-bold">${p.price} جنيه</p>
      <p class="text-sm text-gray-500">${p.type === "male" ? "👞 رجالي" : "👠 حريمي"}</p>
      <div class="mt-3 flex gap-2">
        <button class="flex-1 bg-blue-500 text-white rounded py-1" onclick="editProduct(${i})">تعديل</button>
        <button class="flex-1 bg-red-500 text-white rounded py-1" onclick="deleteProduct(${i})">حذف</button>
      </div>
    `;
    productList.appendChild(div);
  });
}

// إضافة منتج جديد
form.onsubmit = e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  products.push({
    id: Date.now(),
    name: data.name,
    price: parseInt(data.price),
    image: data.image,
    type: data.type
  });
  saveProducts();
  form.reset();
  renderProducts();
};

// حذف منتج
function deleteProduct(index) {
  if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
    products.splice(index, 1);
    saveProducts();
    renderProducts();
  }
}

// تعديل منتج
function editProduct(index) {
  const p = products[index];
  const newName = prompt("اسم المنتج الجديد:", p.name);
  if (!newName) return;
  const newPrice = prompt("السعر الجديد:", p.price);
  if (!newPrice) return;
  products[index].name = newName;
  products[index].price = parseInt(newPrice);
  saveProducts();
  renderProducts();
}
</script>

</body>
</html>
